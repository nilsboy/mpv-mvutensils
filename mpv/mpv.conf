# mpv configuration for MVUtensils frame interpolation.

# A profile that turns on MVUtensils through the bundled VapourSynth script.
# Usage: mpv --config-dir=mpv --profile=mvu video.mkv
#
# The script path is relative to the mpv config dir; ~~ expands to it.
# MVUtensils reads from system memory and its motion search is CPU-bound, so
# offloading decode with a copy-back decoder frees CPU for it. It is CPU-only
# (no GPU renderer), so any hwdec that decodes to system memory works.
# concurrent-frames=8 keeps the cores busy; it measured best on a 4-thread CPU.
[mvu]
vf-add=@mvu:vapoursynth=~~/../vapoursynth/mvutensils.vpy:concurrent-frames=8
hwdec=auto-copy
hwdec-codecs=all
video-sync=display-resample
scripts-append=~~/scripts/mvu-toggle.lua

# The 1080p->60 profile for a 4-thread i3-1315U: interpolation runs at 50% of
# the source size with 16x16 blocks and is scaled back up. This is the
# configuration measured to sustain 60 output fps on the target CPU.
[fast]
vf-add=@mvu:vapoursynth=~~/../vapoursynth/mvutensils.vpy:concurrent-frames=8:user-data="preset=performance;block=16;scale=0.5"
hwdec=auto-copy
hwdec-codecs=all
video-sync=display-resample
scripts-append=~~/scripts/mvu-toggle.lua

# Full-quality 1080p profile for machines with more CPU headroom: small blocks,
# half-pixel accuracy and an uneven multi-hexagon search.
[quality]
vf-add=@mvu:vapoursynth=~~/../vapoursynth/mvutensils.vpy:concurrent-frames=8:user-data="preset=quality"
hwdec=auto-copy
hwdec-codecs=all
video-sync=display-resample
scripts-append=~~/scripts/mvu-toggle.lua
