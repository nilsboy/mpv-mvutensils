    build-environment:
      - PKG_CONFIG_PATH: "$CRAFT_STAGE/usr/lib/x86_64-linux-gnu/pkgconfig:$CRAFT_STAGE/usr/lib/pkgconfig:$CRAFT_STAGE/usr/share/pkgconfig"
    after: [vapoursynth, libplacebo, mvutensils]

  runtime:
    plugin: nil
    override-build: |
      install -Dm755 "$CRAFT_PROJECT_DIR/snap/bin/mpv-mvutensils" \
        "$CRAFT_PART_INSTALL/usr/bin/mpv-mvutensils"
      install -Dm644 "$CRAFT_PROJECT_DIR/mpv/mpv.conf" \
        "$CRAFT_PART_INSTALL/mpv/mpv.conf"
      install -Dm644 "$CRAFT_PROJECT_DIR/mpv/scripts/mvu-toggle.lua" \
        "$CRAFT_PART_INSTALL/mpv/scripts/mvu-toggle.lua"
      install -Dm644 "$CRAFT_PROJECT_DIR/vapoursynth/mvutensils.vpy" \
        "$CRAFT_PART_INSTALL/vapoursynth/mvutensils.vpy"

apps:
  mpv:
    command: usr/bin/mpv-mvutensils
    plugs:
      - home
      - network
      - network-bind
      # The opengl interface also exposes the host's GPU driver libraries.
      - opengl
      - audio-playback
      - audio-record
      - pipewire
      - joystick
      - removable-media
      - screen-inhibit-control
      - unity7
      - x11
      - wayland
    environment:
      LD_LIBRARY_PATH: "$SNAP/usr/lib/python3/dist-packages/vapoursynth:$SNAP/usr/lib/x86_64-linux-gnu:$SNAP/usr/lib"
      PYTHONHOME: "$SNAP/usr"
      PYTHONPATH: "$SNAP/usr/lib/python3/dist-packages"
