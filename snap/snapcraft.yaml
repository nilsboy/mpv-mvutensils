name: mpv-mvutensils
version: "1.0.0"
summary: mpv with MVUtensils motion-interpolation frame rate conversion
description: |
  mpv built with VapourSynth support, bundled with the MVUtensils motion
  estimation plugin and a ready-to-use interpolation script. Enables frame rate
  conversion, e.g. 1080p24 to 60 fps, with all motion estimation running on the
  CPU (wide SIMD); no GPU compute runtime is required.

grade: stable
confinement: strict
base: core26

platforms:
  amd64:

parts:
  libplacebo:
    plugin: meson
    source: https://github.com/haasn/libplacebo.git
    source-depth: 1
    source-submodules: [3rdparty/glad, 3rdparty/Vulkan-Headers, 3rdparty/fast_float]
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
      - -Ddemos=false
      - -Dtests=false
      - -Dvulkan=enabled
      - -Dshaderc=disabled
    build-packages:
      - build-essential
      - meson
      - ninja-build
      - pkg-config
      - libvulkan-dev
      - liblcms2-dev
    build-environment:
      - PKG_CONFIG_PATH: "$CRAFT_STAGE/usr/lib/x86_64-linux-gnu/pkgconfig:$CRAFT_STAGE/usr/lib/pkgconfig:$CRAFT_STAGE/usr/share/pkgconfig"

  vapoursynth:
    plugin: meson
    # R79 still exposes the API 3 compatibility layer as well as API 4.x, so the
    # same install can load MVUtensils (API 4.2) and older plugins alike.
    source: https://github.com/vapoursynth/vapoursynth.git
    source-tag: R79
    source-depth: 1
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
      - -Denable_x86_asm=true
    build-packages:
      - build-essential
      - meson
      - ninja-build
      - pkg-config
      - cython3
      - python3-dev
      - zlib1g-dev
      - libzimg-dev
      - libvulkan-dev
    stage-packages:
      - libpython3.14
      - libpython3.14-stdlib
      - python3.14-minimal
      - python3.14
      - libzimg2
      - libgomp1
    after: [libplacebo]
    override-build: |
      craftctl default
      # MVUtensils locates its plugin directory via the installed Python
      # package, so expose the purelib and a conventional plugin directory.
      PY_PURELIB="$(/usr/bin/python3.14 -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
      VS_PKG="$CRAFT_PART_INSTALL$PY_PURELIB/vapoursynth"
      # The stock .pc omits libdir, which consumers read to locate plugins.
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib/pkgconfig"
      cat > "$CRAFT_PART_INSTALL/usr/lib/pkgconfig/vapoursynth.pc" <<'EOF'
      prefix=/usr
      libdir=/usr/lib
      includedir=${pcfiledir}/../python3/dist-packages/vapoursynth/include

      Name: vapoursynth
      Description: A frameserver for the 21st century
      Version: 79
      Cflags: -I${includedir}
      EOF
      # Autoload plugins from the conventional /usr/lib/vapoursynth directory.
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib/vapoursynth"

  mvutensils:
    plugin: meson
    source: https://github.com/myrsloik/mvutensils.git
    source-depth: 1
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
      # Install the variant DLLs and manifest.vs into VapourSynth's own plugin
      # directory (inside the bundled Python package) so its autoloader picks
      # the matching instruction-set build for the running CPU.
      - -Dpython.purelibdir=/usr/lib/python3/dist-packages
      - -Dpython.platlibdir=/usr/lib/python3/dist-packages
    build-packages:
      - build-essential
      - meson
      - ninja-build
      - pkg-config
      - libzimg-dev
      - libfftw3-dev
    stage-packages:
      - libzimg2
      - libfftw3-single3
      - libfftw3-double3
    after: [vapoursynth]
    build-environment:
      - PKG_CONFIG_PATH: "$CRAFT_STAGE/usr/lib/x86_64-linux-gnu/pkgconfig:$CRAFT_STAGE/usr/lib/pkgconfig:$CRAFT_STAGE/usr/share/pkgconfig"
      # meson queries `import vapoursynth as vs; vs.get_include()` to find the
      # headers, so the staged VapourSynth package must be importable.
      - PYTHONPATH: "$CRAFT_STAGE/usr/lib/python3/dist-packages"

  mpv:
    plugin: meson
    source: https://github.com/mpv-player/mpv.git
    source-depth: 1
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
      - -Dvapoursynth=enabled
      - -Dlibmpv=true
      - -Dcplayer=true
      - -Dmanpage-build=disabled
      - -Dbuild-date=false
    build-packages:
      - build-essential
      - meson
      - ninja-build
      - pkg-config
      - libavcodec-dev
      - libavfilter-dev
      - libavformat-dev
      - libavutil-dev
      - libswresample-dev
      - libswscale-dev
      - libass-dev
      - libvulkan-dev
      - libx11-dev
      - libxext-dev
      - libxrandr-dev
      - libxfixes-dev
      - libxpresent-dev
      - libxss-dev
      - libxv-dev
      - libxkbcommon-dev
      - libwayland-dev
      - wayland-protocols
      - libdrm-dev
      - libgbm-dev
      - libegl-dev
      - libgl-dev
      - libpulse-dev
      - libasound2-dev
      - libpipewire-0.3-dev
      - libuchardet-dev
      - libbluray-dev
      - libdvdnav-dev
      - libcdio-dev
      - libcdio-paranoia-dev
      - liblcms2-dev
      - libsixel-dev
      - liblua5.2-dev
      - libmujs-dev
      - libarchive-dev
      - libsndio-dev
      - librubberband-dev
      - libva-dev
      - libvdpau-dev
      - libzimg-dev
      - libjpeg-dev
      - libzstd-dev
      - python3-dev
      - cython3
    # mpv links the codec/GPU stack dynamically; the strict-confinement snap
    # must bundle it rather than rely on the host.
    stage-packages:
      - i965-va-driver
      - intel-media-va-driver
      - libaom3
      - libarchive13t64
      - libasound2t64
      - libass9
      - libasyncns0
